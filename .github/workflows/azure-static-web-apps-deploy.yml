name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish Blazor Client
        run: dotnet publish BhavanPortfolio/BhavanPortfolio.csproj -c Release -o BhavanPortfolio/published

      - name: Fix Blazor WASM script reference
        run: |
          # Find the fingerprinted blazor.webassembly.*.js file and copy it to the expected name
          cd BhavanPortfolio/published/wwwroot/_framework
          for f in blazor.webassembly.*.js; do
            if [ "$f" != "blazor.webassembly.*.js" ]; then
              cp "$f" blazor.webassembly.js
              echo "Copied $f to blazor.webassembly.js"
            fi
          done

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "BhavanPortfolio/published/wwwroot" # App source code path
          api_location: "Api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######
