name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Download Tailwind CLI
        working-directory: ./BhavanPortfolio
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          mv tailwindcss-linux-x64 tailwindcss

      - name: Build Tailwind CSS
        working-directory: ./BhavanPortfolio
        run: ./tailwindcss -i ./tailwind-input.css -o ./wwwroot/css/app.css --minify

      - name: Publish Blazor WASM
        working-directory: ./BhavanPortfolio
        run: dotnet publish -c Release -o publish
        env:
          CI: true

      - name: Copy 404.html for SPA routing
        run: cp ./BhavanPortfolio/publish/wwwroot/index.html ./BhavanPortfolio/publish/wwwroot/404.html

      - name: Ensure .nojekyll exists
        run: touch ./BhavanPortfolio/publish/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./BhavanPortfolio/publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
