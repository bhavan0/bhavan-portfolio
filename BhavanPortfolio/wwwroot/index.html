<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BhavanPortfolio</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BhavanPortfolio.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <!-- Theme Resolution Script - MUST execute before body renders to prevent FOUC -->
    <script>
        (function() {
            // Priority: localStorage > system preference > dark default
            var theme = localStorage.getItem('theme');
            if (!theme) {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (!theme) {
                theme = 'dark';
            }
            document.documentElement.classList.add(theme);
        })();
    </script>
</head>

<body class="bg-black text-white dark:bg-black dark:text-white light:bg-white light:text-black blazor-loading">
    <!-- Loading Shell - Static hero content matching HeroSection component -->
    <div id="loading-shell" class="min-h-screen flex items-center justify-center">
        <div class="text-center max-w-6xl mx-auto px-4 md:px-6">
            <h1 class="text-5xl md:text-6xl font-bold text-white dark:text-white">Bhavan</h1>
            <p class="text-xl md:text-2xl text-gray-400 mt-4">Full Stack Developer</p>
        </div>
    </div>

    <!-- Blazor App Container -->
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Remove blazor-loading class when Blazor initializes
        Blazor.start().then(function() {
            document.body.classList.remove('blazor-loading');
        });
    </script>
</body>

</html>
