<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags (AC1, AC2, AC3) -->
    <title>Bhavan - Full Stack Developer</title>
    <meta name="description" content="Full Stack Developer specializing in .NET, Blazor, Azure, React, and AI/ML. View my portfolio of projects, skills, and professional experience.">
    <meta name="keywords" content="Bhavan, Full Stack Developer, .NET, Blazor, Azure, React, TypeScript, C#, AI, ML, Portfolio, Software Engineer">
    <meta name="author" content="Bhavan">
    <meta name="robots" content="index, follow">

    <!-- OpenGraph Tags (AC4) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bhavan - Full Stack Developer">
    <meta property="og:description" content="Full Stack Developer specializing in .NET, Blazor, Azure, React, and AI/ML. View my portfolio of projects, skills, and professional experience.">
    <meta property="og:image" content="favicon.png">
    <!-- og:url to be added in Story 1.5 when GitHub Pages URL is known -->
    <meta property="og:site_name" content="Bhavan Portfolio">

    <!-- Twitter Card Tags (AC5) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bhavan - Full Stack Developer">
    <meta name="twitter:description" content="Full Stack Developer specializing in .NET, Blazor, Azure, React, and AI/ML.">
    <meta name="twitter:image" content="favicon.png">

    <!-- Favicon and Mobile (AC7) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="theme-color" content="#000000">

    <base href="/bhavan-portfolio/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="BhavanPortfolio.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <!-- Theme Resolution Script - MUST execute before body renders to prevent FOUC -->
    <script>
        (function() {
            // Priority: localStorage > system preference > dark default
            var theme = localStorage.getItem('theme');
            if (!theme) {
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = prefersDark ? 'dark' : 'light';
            }
            // Fallback to dark if somehow still undefined
            theme = theme || 'dark';
            document.documentElement.classList.add(theme);
        })();
    </script>
</head>

<body class="bg-black text-white blazor-loading">
    <!-- Noscript for JS-disabled browsers (AC4) -->
    <noscript>
        <div class="min-h-screen flex items-center justify-center bg-black text-white">
            <p class="text-xl text-gray-400 text-center px-4">
                This site requires JavaScript to function properly.
            </p>
        </div>
    </noscript>

    <!-- Loading Shell - Static hero content matching HeroSection component -->
    <div id="loading-shell" class="min-h-screen flex items-center justify-center">
        <div class="text-center max-w-6xl mx-auto px-4 md:px-6">
            <h1 class="text-5xl md:text-6xl font-bold text-white">Bhavan</h1>
            <p class="text-xl md:text-2xl text-gray-400 mt-4">Full Stack Developer</p>
        </div>
    </div>

    <!-- WASM Fallback - shown after 10s timeout (AC1, AC2, AC3) -->
    <div id="wasm-fallback" class="min-h-screen flex items-center justify-center" style="display: none;">
        <div class="text-center max-w-6xl mx-auto px-4 md:px-6">
            <p class="text-xl md:text-2xl text-gray-400">
                This site requires a modern browser with JavaScript enabled.
            </p>
        </div>
    </div>

    <!-- Blazor App Container -->
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Set timeout BEFORE calling Blazor.start() (AC1, AC5)
        var wasmTimeout = setTimeout(function() {
            // Hide loading shell (AC6)
            var loadingShell = document.getElementById('loading-shell');
            if (loadingShell) {
                loadingShell.style.opacity = '0';
                loadingShell.style.visibility = 'hidden';
            }
            // Show fallback after brief transition delay (AC6)
            setTimeout(function() {
                if (loadingShell) {
                    loadingShell.style.display = 'none';
                }
                var fallback = document.getElementById('wasm-fallback');
                if (fallback) {
                    fallback.style.display = 'flex';
                    fallback.style.opacity = '1';
                }
            }, 300);
            document.body.classList.remove('blazor-loading');
        }, 10000);

        // Start Blazor and clear timeout on success (AC5, AC7)
        Blazor.start().then(function() {
            clearTimeout(wasmTimeout);
            document.body.classList.remove('blazor-loading');
        }).catch(function(error) {
            // On Blazor error, let the timeout handle the fallback display
            console.error('Blazor initialization failed:', error);
        });
    </script>
</body>

</html>
